# Push a tag like v0.9.0: tests, builds the app and CLI on Windows and Linux and attaches the
# zip and the tar.gz to a GitHub release.
# Run by hand (Actions → release → Run workflow) to only test and build; the packages are then artifacts.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # rustup on the runner installs the toolchain pinned in rust-toolchain.toml on first use.
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: cargo test --workspace --exclude zapret-hub
      - run: ./tools/package.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  linux:
    # The oldest supported runner: its glibc and webkit2gtk-4.1 set the floor for users.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: cargo test --workspace
      - run: bash tools/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz

  release:
    if: github.ref_type == 'tag'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip="dist/zapret-hub-$version.zip"
          tgz="dist/zapret-hub-$version-linux-x86_64.tar.gz"
          for f in "$zip" "$tgz"; do
            [ -f "$f" ] || { echo "$f not built: does the tag match Cargo.toml's version?"; exit 1; }
          done
          # The release notes are this version's section of CHANGELOG.md.
          awk -v v="$version" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" "$zip" "$tgz" --title "Zapret Hub $version" --notes-file notes.md
