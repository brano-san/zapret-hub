id = "discord"
name = "Discord"
apps = ["Discord.exe", "DiscordPTB.exe", "DiscordCanary.exe"]
hint = "Зайдите в голосовой канал"
domains = ["discord.com", "discord.gg", "discord.media", "discordapp.com", "discordapp.net"]

[[probe]]
kind = "https"
target = "discord.com"

[[probe]]
kind = "discord-ip-discovery"
target = "observed"

[[probe]]
kind = "discord-ws"
target = "voice"

[[probe]]
kind = "https-bulk"
target = "observed"
